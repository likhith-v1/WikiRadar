apiVersion: 1

datasources:
  - name: WikiRadar Postgres
    uid: wikiradar-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}

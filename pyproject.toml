[project]
name = "wikiradar"
version = "0.1.0"
description = "Real-time anomaly detection on live English Wikipedia edits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka",
    "requests",
    "psycopg[binary]>=3",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikiradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
